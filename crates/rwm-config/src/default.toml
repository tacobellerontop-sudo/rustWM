# rustWM configuration
#
# Saved changes are picked up automatically. If the file has an error, rustWM
# keeps running with the previous config and logs where the problem is.
#
# Key bindings are not in this file: kerys handles the keyboard and sends
# rustWM commands. Edit %USERPROFILE%\.config\kerys\kerys.toml to change keys;
# `rwm <command>` runs the same commands from a terminal or script.

[general]
# Layout for new workspaces: "dwindle", "master", "monocle", "columns",
# "rows", "grid" or "center" (first window in the middle, for ultrawides).
default_layout = "dwindle"
# Layouts "cycle-layout" (Win+Space) steps through, in order.
layout_cycle = ["dwindle", "master", "monocle"]
# Master layout: how many windows share the master area ("master-count +1"
# / "-1" change it live) and which side it is on: "left", "right", "top" or
# "bottom" ("master-side next" goes round).
master_count = 1
master_side = "left"
# Where new windows go: "after-focused" splits the focused window in half
# (like Hyprland), "end" / "start" split the last / first window.
new_window = "after-focused"
# Workspace names (1 to 9), created on every monitor.
workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]
# "per-monitor": each monitor switches workspaces on its own (Win+1 changes
# only the monitor you're on). "global": all monitors switch together, as one
# big desktop. Win+Alt+W toggles between them.
workspace_mode = "per-monitor"
# Focus a window just by moving the mouse onto it, without clicking.
focus_follows_mouse = false
# Move the mouse to the middle of a window when a key focuses it.
mouse_follows_focus = false
# Pressing the key of the workspace you're on goes back to the previous one.
workspace_back_and_forth = false
# Opacity of windows that don't have focus, 0.1 to 1.0 (1.0 = off).
inactive_opacity = 1.0
# How windows of other workspaces are kept out of sight. "offscreen" moves
# them past the edge of your monitors so they keep their taskbar buttons
# (clicking one switches to its workspace); "hide" hides them, and they leave
# the taskbar until you switch back.
hide_method = "offscreen"
# Command launched by the "terminal" command (Win+Enter). Any exe plus args,
# e.g. "wezterm-gui.exe", "alacritty.exe" or "pwsh.exe". When unset, rustWM
# tries wt.exe, then cmd.exe.
# terminal = "wt.exe -w new"
# Hotkey daemon started with rustWM and stopped when it quits. A bare name is
# looked for next to rustwm.exe, then on PATH. Set to "" to start none (for
# example if you drive rustWM with AutoHotkey or whkd instead).
hotkeys = "kerys.exe"
# Commands run once when rustWM starts, e.g. a status bar.
# exec_on_start = ["yasb.exe"]

[gaps]
inner = 8      # between windows, in pixels at 100% scale
outer = 8      # between windows and the screen edge
smart = true   # no gaps when a workspace has a single window

# Settings for one workspace, by name: its starting layout and gaps.
# [workspace.9]
# layout = "monocle"
# gaps_inner = 0
# gaps_outer = 0

# Windows slide to their new place instead of jumping.
[animation]
enabled = true
duration_ms = 200    # 0 to 1000

# Keep space free at the monitor edges, e.g. for a status bar (pixels at
# 100% scale).
[work_area_offset]
top = 0
bottom = 0
left = 0
right = 0

# A tab bar over every stack ("stack <dir>"), listing its windows; click a
# tab to show that window.
[stackbar]
enabled = true
height = 28                 # pixels at 100% scale, 8 to 100
active_color = "#89b4fa"    # the shown window's tab
inactive_color = "#313244"
text_color = "#cdd6f4"

# Window swallowing (like Hyprland): an app started from one of these
# terminals takes the terminal's tile, and the terminal comes back when the
# app closes. Names are regexes matching the whole exe name, any case.
[swallow]
enabled = false
terminals = ["WindowsTerminal\\.exe", "wezterm-gui\\.exe", "alacritty\\.exe", "kitty\\.exe",
             "ghostty\\.exe", "rio\\.exe", "conhost\\.exe", "OpenConsole\\.exe", "cmd\\.exe",
             "powershell\\.exe", "pwsh\\.exe"]
exceptions = []

# A coloured frame drawn just inside the focused window's edge.
[border]
enabled = true
width = 3            # pixels at 100% scale
color = "#89b4fa"    # #rrggbb

# Rules match windows by exe, class and/or title. exe and class must match the
# whole value (case-insensitive regex); title is a regex searched anywhere.
# Actions: "float", "ignore", "tile", "pin" (float on every workspace),
# "workspace <name>", "monitor <n>" (1 = primary).
#
# Windows that can't be resized (no sizing border, or they refuse the size
# they are given, like launchers with a fixed minimum size) float on their
# own. Add a "tile" rule to force such a window to tile anyway, or a "float"
# rule for windows that resize but look wrong when tiled.

[[rules]]
match = { exe = "CalculatorApp.exe" }
actions = ["float"]

[[rules]]
match = { title = "^Picture-in-Picture$" }
actions = ["float"]

# Fixed-size launchers.
[[rules]]
match = { exe = 'RiotClientServices\.exe|Riot Client\.exe|LeagueClientUx\.exe' }
actions = ["float"]

