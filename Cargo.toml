[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tacobellerontop-sudo/rustWM"

[workspace.dependencies]
rwm-core = { path = "crates/rwm-core" }
rwm-win32 = { path = "crates/rwm-win32" }
rwm-config = { path = "crates/rwm-config" }
rwm-ipc = { path = "crates/rwm-ipc" }

anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
regex = "1"
notify = "8"
clap = { version = "4", features = ["derive"] }
windows = "0.62"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
